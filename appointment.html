<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қабылдауға жазылу - Medicall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Жеке CSS файлы -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-light bg-white shadow-sm py-3 mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">🏥 Medicall</a>
            <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" href="index.html">Артқа қайту</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4 bg-white">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Қабылдауға жазылу</h3>
                        <p class="text-muted">Таңдалған маман: <strong class="text-primary">Др. Айдос Мұратұлы (Терапевт)</strong></p>
                    </div>

                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Пациенттің аты-жөні</label>
                            <input type="text" class="form-control form-control-lg bg-light border-0" placeholder="Толық аты-жөніңізді жазыңыз" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Байланыс телефон нөмірі</label>
                            <input type="tel" class="form-control form-control-lg bg-light border-0" placeholder="+7 (777) 000-00-00" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Қабылдау күні</label>
                                <input type="date" class="form-control form-control-lg bg-light border-0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Қабылдау уақыты</label>
                                <select class="form-select form-select-lg bg-light border-0" required>
                                    <option value="" selected disabled>Уақытты таңдаңыз</option>
                                    <option value="09:00">09:00 - 09:30</option>
                                    <option value="10:00">10:00 - 10:30</option>
                                    <option value="11:00">11:00 - 11:30</option>
                                    <option value="14:00">14:00 - 14:30</option>
                                    <option value="15:00">15:00 - 15:30</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill mt-3 py-3 shadow-sm">Жазылуды растау</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Жеке JS файлы -->
    <script src="script.js"></script>
</body>
</html>
